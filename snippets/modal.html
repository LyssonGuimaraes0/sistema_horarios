<!--Modal de erro de Login-->
<section>
    <div class="modal-background" id="modal-login">
            <div class="section-container">
                <div class="modal-container">
                    <div class="modal login-error">
                        <div class="modal-cabecalho">
                            <span><i class="fa-solid fa-triangle-exclamation" style="font-size:40px;"></i>
</i>Aviso!</span>
                        </div>
                        <div class="modal-descricao">
                            <p>Usuario ou senha estão incorretas!</p>
                            <p>Tente novamente</p>
                        </div>
                        <div class="btn-modal" id="btn-login"><input type="button" value="Okay" class="btn-login"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
