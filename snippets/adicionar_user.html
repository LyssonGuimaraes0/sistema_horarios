<section class="form-section">
    <div class="section-container">
        <div class="formulario">
            <div class="container-form">
                <h1 style="text-align: center;">Cadastro de novo Úsuario</h1>
                <form action="" class="" method="post"  onsubmit="return validarSenhas()">
                    <div class="container-item">
                        <div class="item-formulario">
                            <label for="">Nome Completo:</label>
                            <input type="text" class="input-login" name="nome_completo" id="nome_completo">
                        </div>
                        <div class="item-formulario">
                            <label for="">Nome de acesso:</label>
                            <input type="text" class="input-login" name="username" id="username">
                        </div>
                        <div class="item-formulario">
                            <label for="">Email:</label>
                            <input type="email" class="input-login" name="email" id="email">
                        </div>
                        <div class="item-formulario">
                            <label for="">Setor:</label>
                            <input type="text" class="input-login" name="setor" id="setor">
                        </div>
                        <div class="item-formulario">
                            <label for="">Senha:</label>
                            <input type="password" class="input-login" name="senha" id="senha">
                        </div>
                        <div class="item-formulario">
                            <label for="">Confirmar Senha:</label>

                            <input type="password" class="input-login" name="senha-confirmar" id="senha-confirmar">
                        </div>
                        <label for="">Úsuario tem permissões de Administrador?</label>
                        <input style="margin-bottom: 25px;" type="checkbox" name="checkbox" id="checkbox">
                        <div class="item-formulario"><input type="submit" value="Criar usuario" class="btn-login"></div>
                    </div>
                </form>
            </div>
        </div>
    </div>

</section>
